<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PUC SmartOne Dispatch · 智能指挥调度平台</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #040a15;
      --bg-2: #071425;
      --map: #061528;
      --panel: rgba(5, 17, 34, 0.86);
      --panel-2: rgba(8, 25, 46, 0.76);
      --line: rgba(0, 212, 255, 0.22);
      --line-soft: rgba(116, 207, 255, 0.11);
      --cyan: #00d4ff;
      --cyan-soft: rgba(0, 212, 255, 0.14);
      --blue: #2f80ed;
      --red: #ff2d55;
      --orange: #ff8a1f;
      --green: #35d06f;
      --purple: #9b51e0;
      --white: #eaf7ff;
      --muted: #8ca7bb;
      --weak: #536d82;
      --font-mono: "DIN Alternate", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--white);
      background:
        radial-gradient(circle at 18% 0%, rgba(0, 212, 255, 0.12), transparent 28%),
        radial-gradient(circle at 78% 18%, rgba(155, 81, 224, 0.08), transparent 30%),
        linear-gradient(180deg, #061022, #030812 70%);
      font: 14px/1.45 "Inter", "HarmonyOS Sans SC", "Microsoft YaHei", Arial, sans-serif;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: 72px 1fr 52px;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 210px repeat(4, minmax(150px, 190px)) 1fr 142px;
      gap: 14px;
      align-items: center;
      padding: 10px 18px;
      border-bottom: 1px solid rgba(0, 212, 255, 0.18);
      background: rgba(3, 10, 21, 0.92);
      box-shadow: 0 12px 36px rgba(0,0,0,0.35);
      z-index: 30;
    }

    .brand { line-height: 1; }
    .brand .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #f2fbff;
    }
    .brand .logo::after {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-left: 4px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
    }
    .brand small { display: block; margin-top: 8px; color: #b7c8d8; letter-spacing: 0.3px; }

    .metric {
      height: 54px;
      display: grid;
      grid-template-columns: 42px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      position: relative;
      overflow: hidden;
      border-radius: 8px 16px 8px 16px;
      border: 1px solid var(--line-soft);
      background: linear-gradient(135deg, rgba(10, 29, 54, 0.88), rgba(2, 9, 20, 0.72));
    }
    .metric::before,
    .glass::before {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      top: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      opacity: 0.85;
    }
    .metric .iconBox {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid currentColor;
    }
    .metric b { display: block; color: #dcebf8; font-size: 13px; font-weight: 600; }
    .metric .num { font-family: var(--font-mono); font-size: 29px; line-height: 1; font-weight: 800; }
    .metric .trend { color: currentColor; font-family: var(--font-mono); font-size: 16px; }
    .metric.red { color: var(--red); border-color: rgba(255,45,85,.42); box-shadow: 0 0 22px rgba(255,45,85,.16); }
    .metric.green { color: var(--green); border-color: rgba(53,208,111,.28); }
    .metric.purple { color: var(--purple); border-color: rgba(155,81,224,.32); }
    .metric.orange { color: var(--orange); border-color: rgba(255,138,31,.32); }

    .topActions {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: flex-end;
      min-width: 0;
    }
    .search {
      width: min(430px, 48vw);
      height: 42px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      color: var(--muted);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.26);
    }
    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      color: var(--white);
      background: transparent;
    }
    .topIcon {
      position: relative;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 12px;
      color: #d7e8f8;
      background: rgba(255,255,255,0.04);
    }
    .badge {
      position: absolute;
      top: -5px;
      right: -4px;
      padding: 1px 6px;
      border-radius: 10px;
      background: var(--red);
      color: #fff;
      font-size: 11px;
      font-family: var(--font-mono);
    }
    .operator { display: flex; align-items: center; gap: 8px; justify-content: flex-end; color: #d5e6f5; }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 72px 348px minmax(620px, 1fr) 444px;
      gap: 0;
      padding: 8px 12px 0 4px;
    }

    .rail {
      width: 72px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 8px 6px;
      border: 1px solid rgba(0, 212, 255, 0.22);
      border-radius: 12px;
      background: rgba(3, 13, 27, 0.88);
      box-shadow: inset 0 0 28px rgba(0, 212, 255, 0.05);
    }
    .railGroup { display: flex; flex-direction: column; gap: 8px; }
    .railSep { height: 1px; margin: 2px 12px; background: rgba(255,255,255,0.12); }
    .navBtn {
      width: 58px;
      height: 58px;
      position: relative;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #c6d7e6;
    }
    .navBtn span { display: block; font-size: 12px; margin-top: 4px; }
    .navBtn.active {
      color: var(--cyan);
      background: linear-gradient(180deg, rgba(0,212,255,.16), rgba(0,212,255,.05));
      border: 1px solid rgba(0,212,255,.38);
    }
    .navBtn.active::before {
      content: "";
      position: absolute;
      left: -6px;
      top: 12px;
      width: 3px;
      height: 34px;
      border-radius: 3px;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }
    .navBtn:hover::after {
      content: attr(data-tip);
      position: absolute;
      left: 66px;
      top: 14px;
      z-index: 100;
      white-space: nowrap;
      padding: 7px 10px;
      color: #eaf7ff;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(11,21,37,.96);
    }
    .callDot {
      position: absolute;
      right: 10px;
      bottom: 12px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    .glass {
      min-height: 0;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
    }
    .leftPanel { margin: 0 8px; display: flex; flex-direction: column; }
    .rightPanel { margin-left: 8px; display: flex; flex-direction: column; }
    .panelHead {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .panelHead h2 { margin: 0; font-size: 18px; letter-spacing: .5px; }
    .panelBody { min-height: 0; overflow: auto; padding: 12px; }
    .panelBody::-webkit-scrollbar { width: 6px; }
    .panelBody::-webkit-scrollbar-thumb { background: rgba(0,212,255,.24); border-radius: 10px; }

    .btn, .chip, .tab {
      min-height: 32px;
      border: 1px solid rgba(0,212,255,.2);
      border-radius: 8px;
      color: #cfe6f7;
      background: rgba(11, 31, 55, 0.76);
      transition: 180ms ease;
    }
    .btn { padding: 7px 11px; }
    .btn:hover, .chip:hover, .tab:hover { border-color: rgba(0,212,255,.55); background: rgba(18, 45, 74, .86); }
    .primary { color: var(--cyan); border-color: rgba(0,212,255,.6); background: rgba(0,212,255,.13); box-shadow: inset 0 0 18px rgba(0,212,255,.06); }
    .danger { color: #ff8aa0; border-color: rgba(255,45,85,.42); background: rgba(255,45,85,.09); }
    .ok { color: var(--green); border-color: rgba(53,208,111,.42); background: rgba(53,208,111,.09); }
    .mini { min-height: 28px; padding: 4px 8px; font-size: 12px; }
    .tabs, .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .tab, .chip { padding: 7px 12px; }
    .active { color: var(--cyan); border-color: rgba(0,212,255,.62); background: rgba(0,212,255,.14); }

    .card {
      position: relative;
      margin-bottom: 10px;
      padding: 12px;
      border: 1px solid rgba(0,212,255,.14);
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(12, 32, 55, .82), rgba(4, 12, 25, .72));
      transition: 180ms ease;
    }
    .card:hover, .card.selected {
      border-color: rgba(0,212,255,.52);
      background: linear-gradient(135deg, rgba(16, 45, 76, .88), rgba(5, 16, 31, .8));
      box-shadow: inset 0 0 24px rgba(0,212,255,.07);
    }
    .card.critical { border-left: 3px solid var(--red); box-shadow: inset 14px 0 24px rgba(255,45,85,.06); }
    .card.major { border-left: 3px solid var(--orange); box-shadow: inset 14px 0 24px rgba(255,138,31,.06); }
    .card.info { border-left: 3px solid var(--blue); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .muted { color: var(--muted); }
    .weak { color: var(--weak); }
    .mono { font-family: var(--font-mono); }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 6px; font-size: 12px; }
    .tag.critical { color: #ff8ba0; background: rgba(255,45,85,.14); }
    .tag.major { color: #ffc08a; background: rgba(255,138,31,.14); }
    .tag.info { color: #95c4ff; background: rgba(47,128,237,.16); }
    .tag.green { color: var(--green); background: rgba(53,208,111,.12); }

    .dataStrip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 10px 0;
    }
    .dataItem {
      padding: 9px 8px;
      border-radius: 10px;
      border: 1px solid rgba(0,212,255,.12);
      background: rgba(0,0,0,.18);
      text-align: center;
    }
    .dataItem b { display: block; font: 700 20px var(--font-mono); color: var(--cyan); }
    .dataItem small { color: var(--muted); }

    .mapShell {
      min-height: 0;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgba(0, 212, 255, 0.16);
      background: var(--map);
      box-shadow: inset 0 0 80px rgba(0, 212, 255, 0.035);
    }
    .mapCanvas { position: absolute; inset: 0; }
    .mapCanvas svg { width: 100%; height: 100%; display: block; }
    .mapShade {
      position: absolute; inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 48% 43%, rgba(0,212,255,.12), transparent 28%),
        linear-gradient(90deg, rgba(3,10,22,.2), transparent 18%, transparent 82%, rgba(3,10,22,.28));
    }
    .mapLabel { position: absolute; color: rgba(196, 222, 240, 0.38); font-size: 13px; letter-spacing: .4px; }
    .lifeBar {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 14px;
      z-index: 12;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .lifeStep {
      min-width: 0;
      padding: 8px 8px;
      border: 1px solid rgba(0,212,255,.14);
      border-radius: 10px;
      background: rgba(5, 15, 32, .78);
      color: #7f9ab0;
      text-align: center;
    }
    .lifeStep b { display: block; font-size: 13px; }
    .lifeStep small { font-family: var(--font-mono); font-size: 11px; }
    .lifeStep.done { color: var(--green); border-color: rgba(53,208,111,.32); }
    .lifeStep.current { color: var(--cyan); border-color: rgba(0,212,255,.62); box-shadow: 0 0 18px rgba(0,212,255,.12); }

    .mapTools, .rightTools {
      position: absolute;
      z-index: 15;
      display: flex;
      gap: 8px;
    }
    .mapTools { left: 18px; top: 92px; }
    .rightTools { right: 16px; top: 142px; flex-direction: column; }
    .compass {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 50%;
      background: rgba(5,15,32,.74);
      color: #dcecf8;
      font-family: var(--font-mono);
    }
    .scale { position: absolute; right: 28px; bottom: 26px; color: #cce5f5; font-family: var(--font-mono); }

    .rangeCircle {
      position: absolute;
      left: 48%;
      top: 46%;
      width: 370px;
      height: 370px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      display: none;
      z-index: 6;
      border: 2px solid rgba(0,212,255,.9);
      background: radial-gradient(circle, rgba(0,212,255,.08), rgba(0,212,255,.02) 55%, transparent 72%);
      box-shadow: 0 0 28px rgba(0,212,255,.28), inset 0 0 30px rgba(0,212,255,.08);
    }
    .rangeCircle.show { display: block; }
    .rangeCircle span {
      position: absolute;
      right: -30px;
      top: 50%;
      width: 130px;
      color: var(--cyan);
      font-family: var(--font-mono);
      border-top: 1px dashed var(--cyan);
      padding-top: 5px;
      text-align: right;
    }

    .marker {
      position: absolute;
      z-index: 9;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      transition: transform 180ms ease, opacity 180ms ease, filter 180ms ease;
    }
    .marker:hover, .marker.hover { transform: translate(-50%, -50%) scale(1.08); filter: brightness(1.15); }
    .marker.dim { opacity: .34; }
    .marker .ico { display: grid; place-items: center; color: currentColor; }
    .event .ico {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid currentColor;
      background: rgba(6, 17, 34, .9);
      box-shadow: 0 0 18px currentColor;
    }
    .event.critical { color: var(--red); }
    .event.major { color: var(--orange); }
    .event.info { color: var(--blue); }
    .resource.person { color: var(--cyan); }
    .resource.vehicle { color: var(--blue); }
    .resource.camera { color: var(--purple); }
    .resource.medical { color: var(--green); }
    .resource .ico {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid currentColor;
      background: rgba(8, 21, 38, .9);
      box-shadow: 0 0 13px color-mix(in srgb, currentColor 50%, transparent);
    }
    .resource.camera .ico { width: 24px; height: 24px; }
    .resource.medical .ico { border-radius: 8px; }
    .selected .ico { outline: 2px solid var(--cyan); outline-offset: 4px; }
    .processing::after {
      content: "";
      position: absolute;
      right: -1px;
      bottom: -1px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }
    .pulse::after {
      content: "";
      position: absolute;
      width: 44px;
      height: 44px;
      border: 1px solid currentColor;
      border-radius: 50%;
      animation: pulse 1.1s ease-out 3;
    }
    @keyframes pulse { from { opacity: .8; transform: scale(.75); } to { opacity: 0; transform: scale(1.85); } }

    .routeLine {
      position: absolute;
      height: 2px;
      z-index: 7;
      display: none;
      transform-origin: left center;
      background: linear-gradient(90deg, rgba(0,212,255,.08), rgba(0,212,255,.9));
      box-shadow: 0 0 10px rgba(0,212,255,.35);
    }
    .routeLine.show { display: block; }

    .contextMenu {
      position: fixed;
      z-index: 80;
      min-width: 178px;
      display: none;
      overflow: hidden;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(11,21,37,.96);
      box-shadow: 0 12px 32px rgba(0,0,0,.45);
      backdrop-filter: blur(12px);
    }
    .contextMenu button {
      display: block;
      width: 100%;
      padding: 10px 12px;
      text-align: left;
      border: 0;
      color: #dcecf9;
      background: transparent;
    }
    .contextMenu button:hover { background: rgba(0,212,255,.12); color: var(--cyan); }

    .legend {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 18px 0 94px;
      border-top: 1px solid rgba(0,212,255,.16);
      background: rgba(4, 12, 26, .94);
      color: #cfe3f3;
    }
    .legendGroup { display: flex; align-items: center; gap: 12px; padding-right: 24px; border-right: 1px solid rgba(255,255,255,.11); }
    .legendGroup:last-child { border-right: 0; }
    .dot { width: 12px; height: 12px; display: inline-block; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px currentColor; }
    .square { border-radius: 4px; }

    .toastBox { position: fixed; right: 22px; top: 84px; z-index: 90; display: flex; flex-direction: column; gap: 10px; }
    .toast {
      min-width: 250px;
      padding: 12px 14px;
      border-left: 3px solid var(--cyan);
      border-radius: 10px;
      border: 1px solid rgba(0,212,255,.24);
      background: rgba(10, 22, 39, .97);
      box-shadow: 0 14px 34px rgba(0,0,0,.42);
    }

    .modalMask {
      position: fixed;
      inset: 0;
      z-index: 75;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.46);
    }
    .modalMask.show { display: flex; }
    .modal {
      width: 560px;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid rgba(0,212,255,.28);
      background: rgba(7, 18, 34, .98);
      box-shadow: 0 24px 70px rgba(0,0,0,.56);
    }
    .modal h3 { margin: 0 0 12px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .field input, .field textarea, .field select {
      width: 100%;
      padding: 9px;
      color: #eaf7ff;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      background: rgba(0,0,0,.22);
    }

    .videoFloat, .voiceFloat {
      position: fixed;
      z-index: 65;
      display: none;
      border-radius: 12px;
      border: 1px solid rgba(0,212,255,.3);
      background: rgba(5,15,35,.96);
      box-shadow: 0 18px 48px rgba(0,0,0,.5);
      overflow: hidden;
    }
    .videoFloat { right: 484px; top: 168px; width: 410px; }
    .voiceFloat { right: 484px; bottom: 92px; width: 360px; }
    .videoFloat.show, .voiceFloat.show { display: block; }
    .floatHead { height: 42px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid rgba(255,255,255,.08); cursor: move; }
    .videoView {
      height: 218px;
      position: relative;
      display: grid;
      place-items: center;
      color: #7fc5e7;
      background:
        radial-gradient(circle at 55% 45%, rgba(0,212,255,.12), transparent 30%),
        linear-gradient(135deg, #071b2d, #102a3d);
    }
    .videoView::before { content: ""; position: absolute; inset: 22px; border: 1px solid rgba(0,212,255,.12); border-radius: 50%; }
    .floatActions { display: flex; gap: 8px; padding: 10px; }

    .timeline { margin-left: 10px; padding-left: 16px; border-left: 1px solid rgba(0,212,255,.24); }
    .timelineItem { position: relative; margin: 9px 0; color: #cde0ee; }
    .timelineItem::before { content: ""; position: absolute; left: -21px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    .progress { height: 8px; overflow: hidden; border-radius: 10px; background: rgba(255,255,255,.08); }
    .progress div { width: 48%; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--green)); }

    @media (max-width: 1500px) {
      .topbar { grid-template-columns: 190px repeat(4, 142px) 1fr 120px; gap: 8px; padding-left: 12px; }
      .metric { min-width: 0; padding: 0 8px; }
      .metric .num { font-size: 24px; }
      .workspace { grid-template-columns: 66px 310px minmax(520px, 1fr) 390px; }
      .rail { width: 66px; }
      .navBtn { width: 52px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="logo">PUC</div><small>SmartOne Dispatch</small></div>
      <div class="metric red"><span class="iconBox"><i data-lucide="shield-alert"></i></span><div><b>未处理告警</b><span class="num" id="alarmCount">12</span></div><span class="trend">↑</span></div>
      <div class="metric green"><span class="iconBox"><i data-lucide="phone-call"></i></span><div><b>进行中通话</b><span class="num" id="callCount">3</span></div><span class="trend">●</span></div>

    <div class="floatActions"><button class="btn mini">静音</button><button class="btn mini">保持</button><button class="btn mini">添加成员</button></div>

  <script>
    const stages = ['discover', 'verify', 'assess', 'respond', 'collaborate', 'resolve', 'review'];
    const stageName = { discover: '发现', verify: '确认', assess: '研判', respond: '响应', collaborate: '协同', resolve: '处置', review: '复盘' };
    const alarmSeed = [
      ['alarm-001','枪声探测告警','critical','unhandled','10:24:35','浦东新区 世纪大道附近','ShotSpotter-C01','ShotSpotter',155,48,35],
      ['alarm-002','设备离线告警','major','unhandled','10:25:12','静安区 南京西路附近','摄像头 EC-AC-0892','VideoNet',312,68,42],
      ['alarm-003','主动威胁告警','major','unhandled','10:24:08','黄浦区 外滩附近','AI 分析引擎','AI Vision',376,42,48],
      ['alarm-004','设备电量低','info','unhandled','10:23:45','指挥车-沪A12345','车载终端','Device',459,25,78],
      ['alarm-005','消防通道占用告警','critical','unhandled','10:14:44','国际社区东门','摄像头-C11','AI Vision',620,72,36],
      ['alarm-006','人员SOS告警','critical','unhandled','10:27:20','中央公园北侧','执法终端-P06','SOS',40,55,28],
      ['alarm-007','占道堆物告警','major','unhandled','10:21:12','浦东新区北城路','AI摄像头-18','AI Vision',318,38,55],
      ['alarm-008','井盖异常告警','major','unhandled','10:18:08','滨江路地铁口','井盖传感器-09','IoT',430,58,52],
      ['alarm-009','烟感异常告警','major','unhandled','10:12:09','金融中心B座','烟感-12','Fire IoT',790,60,18],
      ['alarm-010','车辆逆行告警','major','unhandled','10:11:38','高架入口匝道','交通摄像头-31','Traffic AI',835,83,45],
      ['alarm-011','视频信号异常','info','unhandled','10:20:45','南京西路路口','摄像头-EC-09','Video',560,22,50],
      ['alarm-012','人群聚集提示','info','unhandled','10:06:21','城市广场','AI摄像头-26','AI Vision',1140,45,72]
    ];
    const resourceSeed = [
      ['person-001','张三','person','idle',true,.8,3,'值班调度组',44,46],['person-002','李娜','person','busy',true,1.4,8,'巡查队',57,48],['person-003','王强','person','idle',true,1.0,5,'应急组',52,63],['person-004','赵敏','person','idle',true,1.7,9,'值班调度组',61,33],['person-005','陈伟','person','offline',false,2.3,15,'外勤组',30,28],['person-006','刘洋','person','idle',true,.9,4,'巡查队',47,36],['person-007','周宁','person','busy',true,1.8,10,'协管组',66,70],['person-008','吴迪','person','idle',true,2.1,12,'外勤组',34,64],
      ['vehicle-001','警车-001','vehicle','idle',true,.6,4,'巡逻车队',43,49],['vehicle-002','警车-002','vehicle','busy',true,1.2,7,'巡逻车队',55,55],['vehicle-003','指挥车-01','vehicle','idle',true,1.6,9,'指挥中心',26,75],['vehicle-004','巡逻车-04','vehicle','idle',true,1.9,11,'巡逻车队',70,47],['vehicle-005','消防车-02','vehicle','idle',true,2.4,14,'消防联动',77,30],['vehicle-006','保障车-03','vehicle','offline',false,3.2,20,'后勤',18,42],
      ['camera-023','摄像头-23','camera','offline',false,.3,0,'视频专网',50,40],['camera-001','摄像头-01','camera','idle',true,.4,0,'视频专网',46,38],['camera-002','摄像头-02','camera','idle',true,.7,0,'视频专网',55,40],['camera-003','摄像头-03','camera','idle',true,1.1,0,'视频专网',39,35],['camera-004','摄像头-04','camera','idle',true,1.3,0,'视频专网',64,57],['camera-005','摄像头-05','camera','idle',true,1.5,0,'视频专网',34,52],['camera-006','摄像头-06','camera','idle',true,1.9,0,'视频专网',74,22],['camera-007','摄像头-07','camera','idle',true,2.2,0,'视频专网',80,64],['camera-008','摄像头-08','camera','idle',true,2.3,0,'视频专网',29,68],['camera-009','摄像头-09','camera','offline',false,2.8,0,'视频专网',20,56],
      ['medical-001','医疗小组A','medical','idle',true,1.2,8,'急救中心',58,30],['medical-002','医疗小组B','medical','idle',true,2.0,12,'急救中心',74,58],['medical-003','AED站点-03','medical','idle',true,.9,0,'医疗资源',53,51]
    ];
    const alarms = alarmSeed.map(a => ({ id:a[0], name:a[1], level:a[2], status:a[3], time:a[4], address:a[5], source:a[6], system:a[7], duration:a[8], x:a[9], y:a[10], coordinates:[120+a[9]/1000,30+a[10]/1000] }));
    const resources = resourceSeed.map(r => ({ id:r[0], name:r[1], type:r[2], status:r[3], online:r[4], distance:r[5], eta:r[6], organization:r[7], x:r[8], y:r[9], coordinates:[120+r[8]/1000,30+r[9]/1000], currentTask:null, currentCall:false, currentVideo:false }));
    const appState = {
      lifecycleStage: 'discover',
      viewMode: 'monitoring',
      selectedAlarmId: null,
      selectedResourceIds: [],
      alarmFilter: { level: 'all', status: 'unhandled', source: 'all' },
      map: { highlightedMarkerId:null, selectedMarkerId:null, showIncidentRange:false, rangeRadius:800, showRoutes:false },
      communication: { activeCalls:['call-1','call-2','call-3'], activeVideos:['video-1','video-2'], activeMeeting:null },
      tasks: [{name:'路口巡查',status:'待接收'},{name:'设备检修',status:'待接收'},{name:'现场取证',status:'执行中'},{name:'秩序维护',status:'执行中'},{name:'视频核查',status:'已完成'},{name:'日报归档',status:'已完成'}],
      timeline: [],
      reviewTab: 'overview'
    };

    const $ = id => document.getElementById(id);
    const levelText = l => l === 'critical' ? '紧急' : l === 'major' ? '重要' : '提示';
    const icon = (name, size = 18) => `<i data-lucide="${name}" style="width:${size}px;height:${size}px"></i>`;
    const resourceIcon = t => t === 'person' ? 'user' : t === 'vehicle' ? 'car' : t === 'camera' ? 'video' : 'cross';

    function render() {
      renderTop(); renderRail(); renderLife(); renderLeft(); renderRight(); renderMap();
      if (window.lucide) lucide.createIcons();
    }

    function renderTop() {
      $('alarmCount').textContent = alarms.filter(a => a.status === 'unhandled').length;
      $('callCount').textContent = appState.communication.activeCalls.length;
      $('videoCount').textContent = appState.communication.activeVideos.length;
      $('taskCount').textContent = appState.tasks.filter(t => t.status !== '已完成').length;
    }

    function renderRail() {
      const nav = [
        ['layout-dashboard','工作台'], ['monitor','监控'], ['video','视频'], ['phone-call','通信'], 'sep',
        ['clipboard-list','任务'], ['file-cog','预案'], ['bar-chart-3','报表'], 'sep', ['settings','系统']
      ];
      $('rail').innerHTML = nav.map(n => n === 'sep' ? '<div class="railSep"></div>' : `<button class="navBtn ${n[1] === '工作台' ? 'active' : ''}" data-tip="${n[1]}" onclick="toast('${n[1]}模块已聚焦')">${icon(n[0], 22)}<span>${n[1]}</span>${n[1] === '通信' ? '<i class="callDot"></i>' : ''}</button>`).join('');
    }

    function renderLife() {
      const current = stages.indexOf(appState.lifecycleStage);
      $('lifeBar').innerHTML = stages.map((s, index) => `<button class="lifeStep ${index < current ? 'done' : ''} ${index === current ? 'current' : ''}" onclick="goStage('${s}')"><b>${index + 1}. ${stageName[s]}</b><small>${s}</small></button>`).join('');
    }

    function goStage(stage) {
      if (stages.indexOf(stage) <= stages.indexOf(appState.lifecycleStage)) {
        appState.lifecycleStage = stage;
        appState.viewMode = stage === 'discover' ? 'monitoring' : stage === 'review' ? 'review' : 'incident';
        render();
      } else toast('请按事件处置流程顺序推进');
    }

    function renderLeft() {
      const s = appState.lifecycleStage;
      $('leftTitle').textContent = s === 'assess' ? '圈选资源' : s === 'respond' ? '附近可调度资源' : s === 'review' ? '复盘索引' : '资源中心';
      if (s === 'respond') return renderSelectableResources();
      if (s === 'assess') return renderNearbyResources();
      if (s === 'review') {
        $('leftPanel').innerHTML = `<div class="card selected"><b>复盘对象</b><p class="muted">枪声探测告警 / EVT-20260701-001</p></div><div class="dataStrip"><div class="dataItem"><b>19m</b><small>处置时长</small></div><div class="dataItem"><b>3</b><small>调度资源</small></div><div class="dataItem"><b>6</b><small>通信记录</small></div><div class="dataItem"><b>4</b><small>任务节点</small></div></div>`;
        return;
      }
      $('leftPanel').innerHTML = `
        <div class="search" style="width:100%;margin-bottom:12px"><i data-lucide="search"></i><input placeholder="搜索设备 / 人员 / 终端" /></div>
        <div class="chips"><button class="chip active">全部</button><button class="chip">在线</button><button class="chip">空闲</button><button class="chip">告警中</button></div>
        <div class="row" style="margin:12px 0"><b>${icon('star',16)} 收藏资源（6）</b><span class="weak">⌃</span></div>
        ${resources.slice(0, 6).map(resourceCard).join('')}
        ${['最近联系（10）','人员（1256）','车辆（268）','设备（1532）','监控（1284）','群组（86）'].map(x => `<div class="card row"><span>${x}</span><span>›</span></div>`).join('')}
        <button class="btn primary" style="width:100%">浏览组织架构 ›</button>`;
      if (window.lucide) lucide.createIcons();
    }

    function resourceCard(r) {
      return `<div class="card" onmouseenter="hoverMarker('${r.id}')" onmouseleave="hoverMarker(null)" onclick="selectMarker('${r.id}')">
        <div class="row"><b>${r.name}</b><span class="tag ${r.online ? 'green' : ''}">${r.online ? (r.status === 'idle' ? '空闲' : '忙碌') : '离线'}</span></div>
        <div class="muted">${r.organization} · ${r.distance}km · ETA ${r.eta}分</div>
      </div>`;
    }

    function renderNearbyResources() {
      $('leftPanel').innerHTML = `<div class="card selected"><b>智能圈选范围</b><p class="muted">圈内资源高亮，圈外资源降噪显示。</p><div class="chips">${[500, 800, 1000, 2000].map(r => `<button class="chip ${appState.map.rangeRadius === r ? 'active' : ''}" onclick="setRadius(${r})">${r < 1000 ? r + 'm' : r / 1000 + 'km'}</button>`).join('')}</div></div>${resources.filter(r => r.distance <= 1.6).map(resourceCard).join('')}`;
    }

    function renderSelectableResources() {
      const selected = appState.selectedResourceIds;
      const count = type => selected.map(id => resources.find(r => r.id === id)).filter(r => r && r.type === type).length;
      $('leftPanel').innerHTML = `<div class="card selected"><div class="row"><b>已选择 ${selected.length}</b><button class="btn mini" onclick="appState.selectedResourceIds=[];render()">清空</button></div><p class="muted">人员 ${count('person')} / 车辆 ${count('vehicle')} / 摄像头 ${count('camera')}</p><button class="btn primary" style="width:100%" onclick="openDispatchModal()">发起调度</button></div>
        ${resources.slice().sort((a,b)=>(b.online-a.online)||(a.distance-b.distance)).map(r => `<div class="card ${selected.includes(r.id) ? 'selected' : ''}" onmouseenter="hoverMarker('${r.id}')" onmouseleave="hoverMarker(null)"><div class="row"><label><input type="checkbox" ${selected.includes(r.id) ? 'checked' : ''} onchange="toggleResource('${r.id}')"> <b>${r.name}</b></label><span class="tag ${r.online ? 'green' : ''}">${r.online ? r.status : '离线'}</span></div><div class="muted">${r.type} · ${r.distance}km · ETA ${r.eta}分 · ${r.organization}</div><div style="margin-top:8px"><button class="btn mini" onclick="callResource('${r.id}')">语音</button><button class="btn mini" onclick="videoResource('${r.id}')">视频</button><button class="btn mini" onclick="selectMarker('${r.id}')">定位</button></div></div>`).join('')}`;
    }

    function renderRight() {
      const s = appState.lifecycleStage;
      if (s === 'discover') return renderAlarmList();
      if (s === 'verify') return renderVerifyPanel();
      if (s === 'assess') return renderAssessPanel();
      if (s === 'respond') return renderRespondPanel();
      if (s === 'collaborate') return renderCollaboratePanel();
      if (s === 'resolve') return renderResolvePanel();
      return renderReviewPanel();
    }

    function renderAlarmList() {
      $('rightTitle').textContent = '告警中心';
      const filter = appState.alarmFilter.level;
      const list = alarms.filter(a => filter === 'all' || a.level === filter);
      $('rightPanel').innerHTML = `<div class="tabs"><button class="tab active">告警 12</button><button class="tab" onclick="toast('通话列表已打开')">通话 3</button><button class="tab" onclick="toast('视频列表已打开')">视频 2</button><button class="tab" onclick="toast('协同列表已打开')">协同 19</button></div><div class="chips">${[['all','全部 12'],['critical','紧急 3'],['major','重要 6'],['info','提示 3']].map(x => `<button class="chip ${filter === x[0] ? 'active' : ''}" onclick="appState.alarmFilter.level='${x[0]}';renderRight()">${x[1]}</button>`).join('')}<button class="chip" onclick="toast('筛选器已打开')">${icon('sliders-horizontal',14)}</button></div>${list.map(alarmCard).join('')}<button class="btn" style="width:100%" onclick="toast('已展开全部告警')">查看全部告警（12）›</button>`;
      if (window.lucide) lucide.createIcons();
    }

    function alarmCard(a) {
      return `<div class="card ${a.level}" onclick="openAlarm('${a.id}')" ondblclick="openAlarm('${a.id}');enterAssess()" onmouseenter="hoverMarker('${a.id}')" onmouseleave="hoverMarker(null)" oncontextmenu="openContext(event,'alarm','${a.id}')"><div class="row"><b>${icon(a.level === 'critical' ? 'shield-alert' : a.level === 'major' ? 'triangle-alert' : 'info',18)} ${a.name}</b><span class="tag ${a.level}">${levelText(a.level)}</span></div><p class="muted" style="margin:6px 0">${a.address}</p><div class="row muted"><span>${icon('map-pin',14)} ${a.source}</span><span class="mono" style="color:${a.level === 'critical' ? 'var(--red)' : a.level === 'major' ? 'var(--orange)' : 'var(--blue)'}">⏱ ${formatDuration(a.duration)}</span></div><div style="margin-top:8px"><button class="btn mini" onclick="event.stopPropagation();selectMarker('${a.id}')">定位</button><button class="btn mini" onclick="event.stopPropagation();openContext(event,'alarm','${a.id}')">更多</button></div></div>`;
    }

    function renderVerifyPanel() {
      const a = selectedAlarm();
      $('rightTitle').textContent = '告警确认';
      $('rightPanel').innerHTML = `<button class="btn mini" onclick="backDiscover()">← 返回告警列表</button><div class="card ${a.level} selected"><div class="row"><h3 style="margin:0">${a.name}</h3><span class="tag ${a.level}">${levelText(a.level)}</span></div><p class="muted">当前状态：待确认 · 持续 ${formatDuration(a.duration)}</p></div><div class="dataStrip"><div class="dataItem"><b>6</b><small>附近人员</small></div><div class="dataItem"><b>3</b><small>附近车辆</small></div><div class="dataItem"><b>5</b><small>摄像头</small></div><div class="dataItem"><b>4</b><small>历史同类</small></div></div><div class="tabs"><button class="tab active" onclick="verifyTab('overview')">概览</button><button class="tab" onclick="verifyTab('video')">关联视频</button><button class="tab" onclick="verifyTab('nearby')">附近资源</button><button class="tab" onclick="verifyTab('history')">历史告警</button></div><div id="verifyBody"></div><div class="row"><button class="btn danger" onclick="falseAlarm()">标记误报</button><button class="btn primary" onclick="enterAssess()">进入研判</button></div>`;
      verifyTab('overview');
    }

    function verifyTab(tab) {
      const a = selectedAlarm();
      const body = $('verifyBody');
      if (!body) return;
      if (tab === 'video') body.innerHTML = resources.filter(r => r.type === 'camera').slice(0,3).map(r => `<div class="card"><div class="row"><b>${r.name}</b><span>${r.distance}km</span></div><p class="muted">${r.online ? '在线' : '离线'} · 覆盖事件核心区</p><button class="btn primary mini" onclick="openVideo()">查看实时视频</button></div>`).join('');
      else if (tab === 'nearby') body.innerHTML = resources.filter(r => r.distance < 1.5).map(resourceCard).join('');
      else if (tab === 'history') body.innerHTML = '<div class="card">过去 30 天同类告警 4 次，误报 1 次，平均确认耗时 2 分 10 秒。</div>';
      else body.innerHTML = `<div class="card">告警时间：${a.time}<br>位置：${a.address}<br>来源设备：${a.source}<br>来源系统：${a.system}<br>告警编号：EVT-20260701-001<br>最近在线：10:25:20<br>当前负责人：调度员01</div>`;
      if (window.lucide) lucide.createIcons();
    }

    function renderAssessPanel() {
      $('rightTitle').textContent = '智能研判';
      $('rightPanel').innerHTML = `<div class="card selected"><b>影响范围</b><p>默认半径 ${appState.map.rangeRadius}m，圈内资源已高亮，圈外资源已降噪。</p></div><div class="dataStrip"><div class="dataItem"><b>6</b><small>人员</small></div><div class="dataItem"><b>3</b><small>车辆</small></div><div class="dataItem"><b>5</b><small>视频</small></div><div class="dataItem"><b>1</b><small>医疗</small></div></div><b>推荐预案</b>${['枪声警情快速响应预案','重点区域封控预案','医疗救援协同预案'].map(p => `<div class="card" onclick="showPlan('${p}')"><b>${p}</b><p class="muted">点击查看适用场景、参与单位、推荐资源和关键步骤。</p></div>`).join('')}<div class="row"><button class="btn" onclick="appState.lifecycleStage='verify';render()">返回确认</button><button class="btn ok" onclick="toast('已采用推荐预案')">采用推荐预案</button><button class="btn primary" onclick="enterRespond()">开始响应</button></div>`;
    }

    function renderRespondPanel() {
      $('rightTitle').textContent = '事件响应';
      $('rightPanel').innerHTML = `<div class="card selected">推荐调度：张三、警车-001、摄像头-23。请在左侧多选资源后发起调度。</div><div class="card">调度方式：语音呼叫 / 视频呼叫 / 发送消息 / 创建任务 / 建立临时群组。</div>${timelineHtml()}<button class="btn primary" style="width:100%" onclick="openDispatchModal()">发起调度</button>`;
    }

    function renderCollaboratePanel() {
      $('rightTitle').textContent = '协同处置';
      $('rightPanel').innerHTML = `<div class="card selected"><b>临时群组：枪声警情处置组</b><p class="muted">张三发言中 · 警车-001在线 · 调度员01主持</p><button class="btn mini">添加成员</button> <button class="btn mini">移除成员</button></div><div class="card"><b>语音会议</b><p>持续 00:03:12</p><button class="btn mini" onclick="openVoice()">打开会议浮层</button><button class="btn mini">静音</button><button class="btn mini">保持</button></div><div class="card"><b>事件信息共享</b><p class="muted">事件位置、预案和视频链接已同步。</p><button class="btn mini" onclick="toast('事件位置已发送')">发送位置</button><button class="btn mini" onclick="toast('处置任务已发送')">发送任务</button></div><button class="btn primary" style="width:100%" onclick="enterResolve()">进入处置跟踪</button>`;
    }

    function renderResolvePanel() {
      const task = appState.tasks.find(t => t.name === '现场核查任务');
      $('rightTitle').textContent = '处置跟踪';
      $('rightPanel').innerHTML = `<div class="card selected">当前状态：现场处置中<br>负责人：张三<br>已调度资源：2 · 未响应资源：摄像头-23</div><div class="card"><b>当前任务</b><p>${task ? task.name : '未创建'}：${task ? task.status : '-'}</p><button class="btn mini" onclick="createTask()">创建任务</button><button class="btn mini" onclick="updateTask('执行中')">更新为执行中</button><button class="btn mini" onclick="updateTask('已完成')">更新为已完成</button></div>${timelineHtml()}<button class="btn primary" style="width:100%" onclick="finishIncident()">完成事件</button>`;
    }

    function renderReviewPanel() {
      $('rightTitle').textContent = '事件复盘';
      const tabs = [['overview','概览'],['timeline','时间线'],['track','轨迹'],['comm','通信记录'],['media','录音录像'],['report','报告']];
      const tab = appState.reviewTab;
      let body = '';
      if (tab === 'timeline') body = timelineHtml();
      else if (tab === 'track') body = '<div class="card selected"><b>轨迹回放</b><p class="muted">支持播放、暂停、倍速和拖动时间。</p><div class="progress"><div></div></div><br><button class="btn mini" onclick="playTrack()">播放</button> <button class="btn mini">暂停</button> <button class="btn mini">1x / 2x</button></div>';
      else if (tab === 'comm') body = '<div class="card">语音通话 2 条<br>视频通话 1 条<br>即时消息 8 条<br>会议记录 1 条</div>';
      else if (tab === 'media') body = '<div class="card"><b>事件录像</b><div class="videoView" style="height:130px;margin:10px 0">录像 00:00 / 12:30</div><button class="btn mini">播放</button> <button class="btn mini">暂停</button> <button class="btn mini">加载失败重试</button></div>';
      else if (tab === 'report') body = '<div class="card">事件基本信息、处置过程、资源投入、处置时长、关键节点、处置结果、改进建议已生成。</div><button class="btn primary" onclick="toast(\'事件报告已导出\')">导出报告</button> <button class="btn">打印</button>';
      else body = '<div class="card selected"><b>事件摘要</b><p>枪声探测告警已完成处置，总耗时 19 分 49 秒，投入人员 1、车辆 1、视频资源 1。</p></div><div class="card">任务执行：现场核查任务已完成<br>处置结果：未发现进一步风险，现场已恢复。</div>';
      $('rightPanel').innerHTML = `<div class="tabs">${tabs.map(t => `<button class="tab ${tab === t[0] ? 'active' : ''}" onclick="appState.reviewTab='${t[0]}';renderReviewPanel()">${t[1]}</button>`).join('')}</div>${body}<button class="btn" style="width:100%;margin-top:12px" onclick="resetApp()">返回常态值守</button>`;
    }

    function renderMap() {
      const selected = appState.map.selectedMarkerId;
      const markers = [...alarms, ...resources].map(o => {
        const isAlarm = !!o.level;
        const dim = (appState.lifecycleStage === 'verify' && appState.selectedAlarmId && o.id !== appState.selectedAlarmId) || (appState.map.showIncidentRange && !isAlarm && o.distance > 1.6);
        const classes = [isAlarm ? `event ${o.level}` : `resource ${o.type}`, appState.map.highlightedMarkerId === o.id ? 'hover' : '', selected === o.id || appState.selectedResourceIds.includes(o.id) ? 'selected' : '', dim ? 'dim' : '', o.status === 'processing' ? 'processing' : '', o.id === 'alarm-001' && o.status === 'unhandled' ? 'pulse' : ''].join(' ');
        return `<div class="marker ${classes}" style="left:${o.x}%;top:${o.y}%" onclick="${isAlarm ? `openAlarm('${o.id}')` : `selectMarker('${o.id}')`}" oncontextmenu="openContext(event,'${isAlarm ? 'alarm' : o.type}','${o.id}')"><div class="ico">${icon(isAlarm ? (o.level === 'critical' ? 'shield-alert' : o.level === 'major' ? 'triangle-alert' : 'info') : resourceIcon(o.type), 16)}</div></div>`;
      }).join('');
      $('markers').innerHTML = markers;
      $('rangeCircle').classList.toggle('show', appState.map.showIncidentRange);
      $('rangeText').textContent = `半径 ${appState.map.rangeRadius}m`;
      $('routes').innerHTML = appState.map.showRoutes ? appState.selectedResourceIds.map(id => {
        const r = resources.find(x => x.id === id); if (!r) return '';
        const x1 = r.x, y1 = r.y, x2 = 48, y2 = 35, dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx,dy), deg = Math.atan2(dy,dx) * 180 / Math.PI;
        return `<div class="routeLine show" style="left:${x1}%;top:${y1}%;width:${len}%;transform:rotate(${deg}deg)"></div>`;
      }).join('') : '';
      if (window.lucide) lucide.createIcons();
    }

    function selectedAlarm() { return alarms.find(a => a.id === appState.selectedAlarmId) || alarms[0]; }
    function formatDuration(sec) { return `${String(Math.floor(sec / 60)).padStart(2,'0')}:${String(sec % 60).padStart(2,'0')}`; }
    function timelineHtml() { return `<div class="timeline">${appState.timeline.map(t => `<div class="timelineItem">${t}</div>`).join('')}</div>`; }
    function hoverMarker(id) { appState.map.highlightedMarkerId = id; renderMap(); }
    function selectMarker(id) { appState.map.selectedMarkerId = id; renderMap(); toast('地图已定位到 ' + id); }

    function openAlarm(id) {
      const alarm = alarms.find(a => a.id === id);
      appState.selectedAlarmId = id;
      appState.map.selectedMarkerId = id;
      appState.lifecycleStage = 'verify';
      appState.viewMode = 'alarm-detail';
      appState.timeline = ['10:25:31 告警触发', '10:26:02 调度员查看告警'];
      if (alarm && alarm.status === 'unhandled') alarm.status = 'processing';
      render(); toast('已进入告警确认');
    }
    function backDiscover() { appState.lifecycleStage = 'discover'; appState.selectedAlarmId = null; appState.map.selectedMarkerId = null; appState.map.showIncidentRange = false; render(); }
    function enterAssess() { appState.lifecycleStage = 'assess'; appState.map.showIncidentRange = true; appState.timeline.push('10:27:10 进入研判'); render(); }
    function setRadius(r) { appState.map.rangeRadius = r; render(); toast('影响范围已调整为 ' + r + 'm'); }
    function enterRespond() { appState.lifecycleStage = 'respond'; appState.timeline.push('10:28:15 开始事件处置'); render(); }
    function enterCollaborate() { appState.lifecycleStage = 'collaborate'; appState.communication.activeMeeting = { name: '枪声警情处置组' }; appState.timeline.push('10:31:00 建立临时协同群组'); openVoice(); render(); }
    function enterResolve() { appState.lifecycleStage = 'resolve'; render(); }

    function toggleResource(id) { const arr = appState.selectedResourceIds; const i = arr.indexOf(id); i > -1 ? arr.splice(i,1) : arr.push(id); render(); }
    function callResource(id) { appState.communication.activeCalls.push(id); toast('已发起语音呼叫'); renderTop(); openVoice(); }
    function videoResource(id) { appState.communication.activeVideos.push(id); toast('已打开视频联动'); renderTop(); openVideo(); }

    function openDispatchModal() {
      if (!appState.selectedResourceIds.length) appState.selectedResourceIds = ['person-001','vehicle-001','camera-023'];
      showModal('调度确认', `<p>已选择 ${appState.selectedResourceIds.length} 个资源。请选择调度方式：</p><label><input type="checkbox" checked> 语音呼叫</label><br><label><input type="checkbox"> 视频呼叫</label><br><label><input type="checkbox"> 发送消息</label><br><label><input type="checkbox" checked> 创建任务</label><br><label><input type="checkbox" checked> 建立临时群组</label>`, [{text:'取消'}, {text:'确认调度', className:'primary', action:confirmDispatch}]);
    }
    function confirmDispatch() {
      closeModal();
      appState.map.showRoutes = true;
      appState.communication.activeCalls.push('incident-call');
      appState.tasks.push({ name:'现场核查任务', status:'待接收' });
      appState.timeline.push('10:29:05 调度警车-001', '10:29:20 调度张三', '10:30:40 创建现场核查任务');
      renderTop(); renderMap();
      showModal('调度完成 2/3', '<div class="card">张三：已通知<br>警车-001：已通知<br>摄像头-23：设备离线</div>', [{text:'重试失败项', className:'primary', action:() => { closeModal(); toast('重试成功：摄像头已改发消息'); enterCollaborate(); }}, {text:'改发消息', action:() => toast('已改发消息')}, {text:'关闭', action:enterCollaborate}]);
    }

    function createTask() { if (!appState.tasks.find(t => t.name === '现场核查任务')) appState.tasks.push({ name:'现场核查任务', status:'待接收' }); appState.timeline.push('10:30:40 创建现场核查任务'); render(); toast('现场核查任务已创建'); }
    function updateTask(status) { const task = appState.tasks.find(t => t.name === '现场核查任务'); if (task) task.status = status; appState.timeline.push(status === '执行中' ? '10:33:12 张三确认接收任务' : '10:45:20 现场反馈完成'); render(); toast('任务状态已更新为 ' + status); }
    function finishIncident() { showModal('完成事件', '<div class="field"><label>处置结果</label><select><option>已处置完成</option></select></div><div class="field"><label>事件分类</label><select><option>治安警情</option></select></div><div class="field"><label>处置说明</label><textarea rows="4">现场已核查，未发现持续风险，事件闭环。</textarea></div><label><input type="checkbox"> 需要后续跟进</label><br><label><input type="checkbox" checked> 生成复盘报告</label>', [{text:'取消'}, {text:'确认完成', className:'primary', action:() => { closeModal(); appState.lifecycleStage = 'review'; appState.viewMode = 'review'; appState.timeline.push('10:45:20 现场反馈完成'); render(); toast('事件已完成，进入复盘'); }}]); }
    function falseAlarm() { showModal('标记误报', '<p>请选择误报原因：</p><div class="field"><select><option>设备误触发</option><option>重复告警</option><option>测试告警</option><option>其他</option></select></div>', [{text:'取消'}, {text:'确认误报', className:'primary', action:() => { selectedAlarm().status = 'false'; closeModal(); backDiscover(); toast('已标记误报'); }}]); }
    function showPlan(name) { showModal('预案详情', `<p><b>${name}</b></p><p>适用场景：重大警情快速响应。参与单位：巡逻车队、值班调度组、视频专网。推荐资源：张三、警车-001、摄像头-23。</p><ol><li>视频核实</li><li>调度最近警力</li><li>建立临时群组</li><li>现场反馈</li></ol>`, [{text:'关闭'}]); }

    function renderReviewPanelOnly() { renderReviewPanel(); if (window.lucide) lucide.createIcons(); }
    function playTrack() { appState.map.showRoutes = true; renderMap(); toast('轨迹回放开始'); }
    function resetApp() { appState.lifecycleStage = 'discover'; appState.viewMode = 'monitoring'; appState.selectedAlarmId = null; appState.selectedResourceIds = []; appState.map.showIncidentRange = false; appState.map.showRoutes = false; appState.reviewTab = 'overview'; render(); toast('已返回常态值守'); }
    function clearMapState() { appState.map.highlightedMarkerId = null; appState.map.selectedMarkerId = null; toast('地图临时状态已清除'); renderMap(); }
    function simulateNewAlarm() { alarms.unshift({ id:'alarm-new-' + Date.now(), name:'人工上报突发事件', level:'critical', status:'unhandled', time:'10:32:10', address:'城市广场西侧', source:'人工上报', system:'Mobile', duration:5, x:62, y:44 }); toast('收到新的紧急告警'); render(); }

    function openVideo() { $('videoFloat').classList.add('show'); appState.communication.activeVideos.push('live'); renderTop(); if (window.lucide) lucide.createIcons(); }
    function closeVideo() { $('videoFloat').classList.remove('show'); toast('视频浮窗已关闭'); }
    function openVoice() { $('voiceFloat').classList.add('show'); renderTop(); }
    function closeVoice() { $('voiceFloat').classList.remove('show'); toast('语音会议已结束'); }

    function showModal(title, html, buttons) {
      $('modal').innerHTML = `<h3>${title}</h3>${html}<div class="row" style="justify-content:flex-end;margin-top:16px">${buttons.map((b,i) => `<button class="btn ${b.className || ''}" id="modalBtn${i}">${b.text}</button>`).join('')}</div>`;
      $('modalMask').classList.add('show');
      buttons.forEach((b,i) => $('modalBtn' + i).onclick = b.action || closeModal);
    }
    function closeModal() { $('modalMask').classList.remove('show'); }
    function toast(text) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = text; $('toastBox').appendChild(el); setTimeout(() => el.remove(), 2600); }

    function openContext(event, type, id) {
      event.preventDefault(); event.stopPropagation();
      const items = {
        map:['添加兴趣点','周边圈选','位置分享','设为视图中心点','地图导航'],
        person:['语音呼叫','视频呼叫','发送消息','创建任务','定位','查看轨迹','查看详情'],
        vehicle:['呼叫车台','发送消息','创建任务','导航','查看轨迹','查看详情'],
        camera:['实时视频','录像回放','云台控制','查看详情'],
        alarm:['查看详情','开始处置','关联资源','标记误报','查看历史']
      }[type] || ['展开聚合','查看列表','局部放大'];
      const menu = $('contextMenu');
      menu.innerHTML = items.map(item => `<button onclick="contextAction('${item}','${id || ''}')">${item}</button>`).join('');
      menu.style.display = 'block';
      const width = 190, height = items.length * 40;
      let x = event.clientX, y = event.clientY;
      if (innerWidth - x < width) x -= width;
      if (innerHeight - y < height) y -= height;
      menu.style.left = x + 'px'; menu.style.top = y + 'px';
    }
    function contextAction(action, id) { $('contextMenu').style.display = 'none'; if (action.includes('视频') || action.includes('实时')) openVideo(); else if (action.includes('处置') && id) openAlarm(id); else toast(action + ' 已执行'); }
    document.addEventListener('click', e => { if (!e.target.closest('.contextMenu')) $('contextMenu').style.display = 'none'; });

    function makeDraggable(panelId, handleId) {
      const panel = $(panelId), handle = $(handleId);
      if (!panel || !handle) return;
      let dragging = false, offsetX = 0, offsetY = 0;
      handle.addEventListener('mousedown', e => { dragging = true; const rect = panel.getBoundingClientRect(); offsetX = e.clientX - rect.left; offsetY = e.clientY - rect.top; });
      document.addEventListener('mousemove', e => { if (!dragging) return; panel.style.left = e.clientX - offsetX + 'px'; panel.style.top = e.clientY - offsetY + 'px'; panel.style.right = 'auto'; });
      document.addEventListener('mouseup', () => dragging = false);
    }

    makeDraggable('videoFloat', 'videoHead');
    render();
    setTimeout(() => toast('常态值守中：点击“枪声探测告警”开始演示'), 500);
  </script>
</body>
</html>
