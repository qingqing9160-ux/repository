function renderReview(){ $('rightTitle').textContent='事件复盘'; let tab=appState.reviewTab||'overview'; const tabs=[['overview','概览'],['timeline','时间线'],['track','轨迹'],['comm','通信记录'],['media','录音录像'],['report','报告']]; let body=''; if(tab==='timeline') body=`<div class="timeline">${appState.timeline.map(t=>`<div class="tl">${t}</div>`).join('')}</div>`; else if(tab==='track') body='<div class="card"><b>轨迹回放</b><div class="progressBar"><div id="trackProg"></div></div><button class="btn mini" onclick="playTrack()">播放</button><button class="btn mini">暂停</button><button class="btn mini">1x/2x</button></div>'; else if(tab==='comm') body='<div class="card">语音通话 2 条<br>视频通话 1 条<br>即时消息 8 条<br>会议记录 1 条</div>'; else if(tab==='media') body='<div class="card"><b>事件录像</b><div class="videoView" style="height:120px">录像 00:00 / 12:30</div><button class="btn mini">播放</button><button class="btn mini">暂停</button><button class="btn mini">重试</button></div>'; else if(tab==='report') body='<div class="card">事件基本信息、处置过程、资源投入、处置时长、关键节点、处置结果、改进建议已生成。</div><button class="btn primary" onclick="toast(\'事件报告已导出\')">导出报告</button> <button class="btn">打印</button>'; else body='<div class="card active"><b>事件摘要</b><p>枪声探测告警已完成处置，总耗时 19分49秒，投入人员1、车辆1、视频资源1。</p></div><div class="card">任务执行：现场核查任务已完成<br>处置结果：未发现进一步风险，现场已恢复。</div>'; $('rightContent').innerHTML=`<div class="tabs">${tabs.map(x=>`<button class="tab ${tab===x[0]?'active':''}" onclick="appState.reviewTab='${x[0]}';renderReview()">${x[1]}</button>`).join('')}</div>${body}<button class="btn" onclick="resetApp()" style="margin-top:12px;width:100%">返回常态值守</button>`}
function renderMap(){let m=$('markers');m.innerHTML=[...alarms,...resData].map(o=>{let isAlarm=!!o.level, cls=isAlarm?`event ${o.level}`:`res ${o.type}`, dim=(appState.selectedAlarmId&&appState.lifecycleStage==='verify'&&o.id!==appState.selectedAlarmId)||(appState.map.showIncidentRange&&!isAlarm&&o.distance>1.6); return `<div class="marker ${cls} ${appState.map.highlightedMarkerId===o.id?'hover':''} ${appState.map.selectedMarkerId===o.id||appState.selectedResourceIds.includes(o.id)?'selected':''} ${dim?'dim':''} ${o.id==='alarm-001'&&o.status==='unhandled'?'pulse':''}" style="left:${o.x}%;top:${o.y}%;color:${isAlarm?(o.level==='critical'?'var(--red)':o.level==='major'?'var(--orange)':'var(--blue)'):''}" onclick="${isAlarm?`openAlarm('${o.id}')`:`selectMarker('${o.id}')`}" oncontextmenu="openContext(event,'${isAlarm?'alarm':o.type}','${o.id}')"><div class="ico">${icon(isAlarm?(o.level==='critical'?'shield-alert':'triangle-alert'):resIcon(o.type),16)}</div></div>`}).join('');$('rangeCircle').classList.toggle('show',appState.map.showIncidentRange);$('rangeText').textContent='半径 '+appState.map.rangeRadius+'m';$('routes').innerHTML=appState.map.showRoutes?appState.selectedResourceIds.map(id=>{let r=resData.find(x=>x.id===id);if(!r)return'';let x1=r.x,y1=r.y,x2=48,y2=42,dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;return `<div class="routeLine show" style="left:${x1}%;top:${y1}%;width:${len}%;transform:rotate(${ang}deg)"></div>`}).join(''):'';lucide.createIcons()}

function confirmDispatch(){closeModal();appState.dispatch.results=[['张三','已通知'],['警车-001','已通知'],['摄像头-23','设备离线']];appState.map.showRoutes=true;appState.communication.activeCalls.push('incident-call');appState.tasks.push({name:'现场核查任务',status:'待接收'});appState.timeline.push('10:29:05 调度警车-001','10:29:20 调度张三','10:30:40 创建现场核查任务');showModal('调度完成 2/3',`<div class="card">张三：已通知<br>警车-001：已通知<br>摄像头-23：设备离线</div>`,[{t:'重试失败项',c:'primary',fn:()=>{closeModal();toast('重试成功：摄像头已改发消息');enterCollaborate()}},{t:'改发消息',fn:()=>toast('已改发消息')},{t:'关闭',fn:enterCollaborate}]);renderTop();renderMap()}
function enterCollaborate(){appState.lifecycleStage='collaborate';appState.communication.activeMeeting={name:'枪声警情处置组'};appState.timeline.push('10:31:00 建立临时协同群组');render()}function enterResolve(){appState.lifecycleStage='resolve';render()}function createTask(){if(!appState.tasks.find(t=>t.name==='现场核查任务'))appState.tasks.push({name:'现场核查任务',status:'待接收'});appState.timeline.push('10:30:40 创建现场核查任务');render();toast('任务已创建')}function updateTask(st){let t=appState.tasks.find(t=>t.name==='现场核查任务');if(t){t.status=st;appState.timeline.push(st==='执行中'?'10:33:12 张三确认接收任务':'10:45:20 现场反馈完成');render();toast('任务状态已更新为 '+st)}}function finishIncident(){showModal('完成事件',`<div class="formGrid"><div class="field"><label>处置结果</label><select><option>已处置完成</option></select></div><div class="field"><label>事件分类</label><select><option>治安警情</option></select></div><div class="field" style="grid-column:1/3"><label>处置说明</label><textarea>现场已核查，未发现持续风险，事件闭环。</textarea></div><label><input type="checkbox"> 需要后续跟进</label><label><input type="checkbox" checked> 生成复盘报告</label></div>`,[{t:'取消'},{t:'确认完成',c:'primary',fn:()=>{closeModal();appState.lifecycleStage='review';appState.viewMode='review';appState.timeline.push('10:45:20 现场反馈完成');render();toast('事件已完成，进入复盘')}}])}
function falseAlarm(){showModal('标记误报',`<p>请选择误报原因：</p><select style="width:100%;padding:8px;background:#071426;color:white"><option>设备误触发</option><option>重复告警</option><option>测试告警</option><option>其他</option></select>`,[{t:'取消'},{t:'确认误报',c:'primary',fn:()=>{selAlarm().status='false';closeModal();backDiscover();toast('已标记误报')}}])}
function simulateNewAlarm(){alarms.unshift({id:'alarm-new-'+Date.now(),name:'人工上报突发事件',level:'critical',status:'unhandled',time:'10:32:10',address:'城市广场西侧',source:'人工上报',system:'Mobile',duration:5,x:62,y:44});toast('收到新的紧急告警');render()}
function openVideo(){$('videoFloat').classList.add('show');appState.communication.activeVideos.push('live');renderTop();lucide.createIcons()}function closeVideo(){$('videoFloat').classList.remove('show');toast('视频浮窗已关闭')}
function showModal(title,html,buttons){$('modal').innerHTML=`<h3>${title}</h3>${html}<div class="row" style="justify-content:flex-end;margin-top:16px">${buttons.map((b,i)=>`<button class="btn ${b.c||''}" id="mb${i}">${b.t}</button>`).join('')}</div>`;$('modalMask').classList.add('show');buttons.forEach((b,i)=>$('mb'+i).onclick=b.fn||closeModal);lucide.createIcons()}function closeModal(){$('modalMask').classList.remove('show')}function toast(msg){let d=document.createElement('div');d.className='toast';d.textContent=msg;$('toastBox').appendChild(d);setTimeout(()=>d.remove(),2600)}
function openContext(e,type,id){e.preventDefault();let items={map:['添加兴趣点','周边圈选','位置分享','设为视图中心点','地图导航'],person:['语音呼叫','视频呼叫','发送消息','创建任务','定位','查看轨迹','查看详情'],vehicle:['呼叫车台','发送消息','创建任务','导航','查看轨迹','查看详情'],camera:['实时视频','录像回放','云台控制','查看详情'],alarm:['查看详情','开始处置','关联资源','标记误报','查看历史']};let menu=$('contextMenu');menu.innerHTML=(items[type]||items.map).map(x=>`<button onclick="ctxAction('${x}','${id||''}')">${x}</button>`).join('');menu.style.display='block';let w=180,h=(items[type]||items.map).length*38,x=e.clientX,y=e.clientY;if(innerWidth-x<w)x-=w;if(innerHeight-y<h)y-=h;menu.style.left=x+'px';menu.style.top=y+'px'}function ctxAction(x,id){$('contextMenu').style.display='none';if(x.includes('视频'))openVideo();else if(x.includes('处置')&&id)openAlarm(id);else toast(x+' 已执行')}document.addEventListener('click',e=>{if(!e.target.closest('.context'))$('contextMenu').style.display='none'});
function clearMap(){appState.map.highlightedMarkerId=null;appState.map.selectedMarkerId=null;$('mapTip').classList.remove('show');toast('地图临时状态已清除');renderMap()}function playTrack(){toast('轨迹回放开始');appState.map.showRoutes=true;renderMap()}function resetApp(){appState.lifecycleStage='discover';appState.viewMode='monitoring';appState.selectedAlarmId=null;appState.selectedResourceIds=[];appState.map.showIncidentRange=false;appState.map.showRoutes=false;appState.reviewTab='overview';$('incidentTimer').style.display='none';clearInterval(timer);render();toast('已返回常态值守')}
function startTimer(){if(timer)return;$('incidentTimer').style.display='block';timer=setInterval(()=>{seconds++;$('incidentTimer').textContent='事件处置中 '+String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')},1000)}
let drag=false,off=[0,0];$('floatHead').onmousedown=e=>{drag=true;let r=$('videoFloat').getBoundingClientRect();off=[e.clientX-r.left,e.clientY-r.top]};document.onmousemove=e=>{if(drag){$('videoFloat').style.left=e.clientX-off[0]+'px';$('videoFloat').style.top=e.clientY-off[1]+'px';$('videoFloat').style.right='auto'}};document.onmouseup=()=>drag=false;
render();setTimeout(()=>toast('常态值守中：可点击“枪声探测告警”开始演示'),600);
</script>
